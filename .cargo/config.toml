# Android libraries are aligned to 16 KB pages, as Google Play requires for Android 15+
# (specs/design.md §9.4.1, LD23). NDK r28 and later already do this by default; the explicit
# flag keeps the result independent of the NDK version. scripts/android/check.sh verifies it.
# Note: a RUSTFLAGS environment variable replaces these settings; the check catches that.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.armv7-linux-androideabi]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

# Godot on the web: a non-threaded Emscripten side module (specs/design.md §9.3.1, LD27, LD28), built
# by scripts/godot-web/build.sh with the pinned nightly and Emscripten. These unstable (-Z) flags only
# apply to this target, so stable builds of every other target are unaffected. No -pthread and no
# +atomics: the library does not use threads. A RUSTFLAGS environment variable replaces these
# settings; scripts/godot-web/check-wasm.mjs catches the result (it needs the side module marker).
[target.wasm32-unknown-emscripten]
rustflags = [
    "-C", "link-args=-sSIDE_MODULE=2",
    "-C", "llvm-args=-enable-emscripten-cxx-exceptions=0",
    "-Z", "default-visibility=hidden",
    "-Z", "link-native-libraries=no",
    "-Z", "emscripten-wasm-eh=false",
]
