name: Godot web verification report (GW1–GW8)
description: Results of the manual Godot web checklist in bindings/godot/TESTING.md.
title: "[Godot web check]: Godot <version> in <browser> on <OS>"
labels: ["godot", "verification"]
body:
  - type: markdown
    attributes:
      value: |
        Follow [TESTING.md](https://github.com/basteez/mumble-speech/blob/main/bindings/godot/TESTING.md)
        and report here, even if everything works. Thank you!
  - type: input
    id: godot
    attributes:
      label: Godot version
      placeholder: "4.3-stable or 4.7.2-stable"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Safari 19 on macOS 26, Firefox 140, Chrome 140"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and CPU
      placeholder: "macOS 26 arm64"
    validations:
      required: true
  - type: input
    id: addon
    attributes:
      label: Addon version and source
      placeholder: "0.3.0 from the release zip, or built from source at <commit>"
    validations:
      required: true
  - type: dropdown
    id: gw1
    attributes:
      label: "GW1: the example in the browser"
      options: ["Pass", "Fail", "Not tested"]
    validations:
      required: true
  - type: dropdown
    id: gw2
    attributes:
      label: "GW2: timing and memory with sound"
      options: ["Pass", "Fail", "Not tested"]
    validations:
      required: true
  - type: dropdown
    id: gw3
    attributes:
      label: "GW3: the test runner (MUMBLE_WEB_TESTS PASS)"
      options: ["Pass", "Fail", "Not tested"]
    validations:
      required: true
  - type: dropdown
    id: gw5
    attributes:
      label: "GW5: iOS Safari and itch.io (optional)"
      options: ["Pass", "Fail", "Not tested"]
    validations:
      required: true
  - type: dropdown
    id: gw6
    attributes:
      label: "GW6: Thread Support on, served with COOP/COEP (crossOriginIsolated true, the threaded library loads, the example and MUMBLE_WEB_TESTS PASS)"
      options: ["Pass", "Fail", "Not tested"]
    validations:
      required: true
  - type: textarea
    id: gw7
    attributes:
      label: "GW7: what a threaded export shows when served without COOP/COEP (Godot's error, or another failure)"
      description: Chrome and Firefox. Leave empty if not tested.
  - type: dropdown
    id: gw8
    attributes:
      label: "GW8: itch.io SharedArrayBuffer option and the PWA option (optional)"
      options: ["Pass", "Fail", "Not tested"]
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Browser console errors and warnings
      description: Copy them as they are.
      render: text
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything that was confusing, surprising, or sounded wrong.
