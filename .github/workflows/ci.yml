# Minimal CI (task A2). Jobs follow specs/design.md §10; wasm, ffi, godot and release come with their phases.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Performance budgets are for a mid-range laptop; shared runners get slack (specs/design.md, LD10).
  MUMBLE_PERF_SLACK: 3

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      - name: Tests (release, includes the L2.5 benchmark)
        run: cargo test --release
      - name: Builds for WebAssembly (L1.3)
        run: cargo build -p mumble-speech --target wasm32-unknown-unknown --release
      - name: Crate packages for crates.io (L9.2)
        if: runner.os == 'Linux'
        run: cargo publish --dry-run -p mumble-speech

  ffi:
    name: ffi (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Header is up to date
        if: runner.os == 'Linux'
        run: |
          cargo install cbindgen --version 0.29.4 --locked
          cbindgen --config crates/mumble-ffi/cbindgen.toml --crate mumble-ffi --output bindings/c/include/mumble.h --verify crates/mumble-ffi
      - name: Build (Linux, Windows)
        if: runner.os != 'macOS'
        run: cargo build -p mumble-ffi --release
      - name: Build universal library (macOS arm64 + x86_64)
        if: runner.os == 'macOS'
        run: |
          cargo build -p mumble-ffi --release --target aarch64-apple-darwin
          cargo build -p mumble-ffi --release --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create -output target/release/libmumble_ffi.dylib \
            target/aarch64-apple-darwin/release/libmumble_ffi.dylib \
            target/x86_64-apple-darwin/release/libmumble_ffi.dylib
          lipo -info target/release/libmumble_ffi.dylib
      - name: Configure
        run: cmake -S bindings/c -B build/c -DCMAKE_BUILD_TYPE=Release ${{ runner.os == 'macOS' && '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"' || '' }}
      - name: Build tests
        run: cmake --build build/c --config Release
      - name: CTest (all conformance vectors through the C ABI)
        run: ctest --test-dir build/c -C Release --output-on-failure
      - name: Conformance vectors as x86_64 under Rosetta (macOS)
        if: runner.os == 'macOS'
        run: arch -x86_64 build/c/test_vectors

  godot:
    name: godot (${{ matrix.godot }})
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported version (L4.6) and the latest tested one.
        godot: [4.3-stable, 4.7.2-stable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the GDExtension into the addon
        run: bindings/godot/build.sh
      - name: Download Godot ${{ matrix.godot }}
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${{ matrix.godot }}/Godot_v${{ matrix.godot }}_linux.x86_64.zip"
          unzip -q godot.zip -d godot
          mv godot/Godot_v*_linux.x86_64 godot/godot
      - name: Import project
        run: godot/godot --headless --path bindings/godot --import || true
      - name: Headless tests (vectors, typewriter, say)
        run: godot/godot --headless --path bindings/godot -s res://tests/run_tests.gd
      - name: Example scene runs without errors
        run: |
          godot/godot --headless --path bindings/godot --quit-after 300 2>&1 | tee example.log
          ! grep -E "SCRIPT ERROR|ERROR:" example.log

  unity-interop:
    # The Unity package's UnityEngine-free code, C# 9, against the real native library (LD13).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the C ABI library
        run: cargo build -p mumble-ffi --release
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Conformance vectors through the C# interop layer
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
        run: dotnet run -c Release --project "bindings/unity/DotnetTests~/MumbleSpeech.Interop.Tests.csproj"

  android:
    # Unity on Android (specs/design.md §9.4.1, L4.13, L4.14, LD21-LD25): the three libraries are built,
    # checked and their import settings verified; the core vectors run on 32-bit ARM under QEMU.
    runs-on: ubuntu-latest
    env:
      # Pinned: an LTS NDK (LD23). Bump together with the NDK in release.yml.
      NDK_VERSION: r27c
      CARGO_NDK_VERSION: 3.5.4
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,armv7-unknown-linux-gnueabihf
      - uses: Swatinem/rust-cache@v2
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false
      - name: Export the NDK location
        run: echo "ANDROID_NDK_HOME=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
      - name: Build the libraries for arm64-v8a, armeabi-v7a, x86_64
        run: scripts/android/build.sh target/android
      - name: Check the libraries (exports, machine, 16 KB alignment, dependencies)
        run: scripts/android/check.sh target/android bindings/c/include/mumble.h
      - name: Check the Unity import settings
        run: scripts/android/check-metas.sh bindings/unity
      - name: Negative self-tests of the checks
        run: scripts/android/selftest.sh target/android
      - name: Install QEMU and the 32-bit ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
      - name: Core conformance vectors on 32-bit ARM (QEMU user mode, LD25)
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_RUNNER: qemu-arm -L /usr/arm-linux-gnueabihf
        run: cargo test -p mumble-conformance --target armv7-unknown-linux-gnueabihf

  site:
    # Docs at /, playground at /playground/ (specs/design.md §12, L7). Deployed from main only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the site (fails on dead links)
        run: npm run build:site
      - name: Deploy to mumble-speech.github.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.SITE_DEPLOY_KEY }}
          external_repository: mumble-speech/mumble-speech.github.io
          publish_branch: main
          publish_dir: docs/.vitepress/dist
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: Deploy basteez/mumble-speech@${{ github.sha }}

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          # Must match the wasm-bindgen crate version in crates/mumble-wasm.
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build (WASM + TypeScript)
        run: npm run build --workspace @mumble-speech/web
      - name: Typecheck
        run: npm run typecheck --workspace @mumble-speech/web
      - name: Tests (vectors in WASM, Speaker equivalence, L2.5, L4.2 size)
        run: npm test --workspace @mumble-speech/web
      - name: External consumption check (L6.2)
        run: npm run consume-check --workspace @mumble-speech/web

  playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The playground consumes @mumble-speech/web, which is built from the Rust core.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build @mumble-speech/web
        run: npm run build --workspace @mumble-speech/web
      - name: Typecheck
        run: npm run typecheck --workspace @mumble-speech/playground
      - name: Tests
        run: npm test --workspace @mumble-speech/playground
      - name: Build
        run: npm run build --workspace @mumble-speech/playground
