# Minimal CI (task A2). Jobs follow specs/design.md §10; wasm, ffi, godot and release come with their phases.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Performance budgets are for a mid-range laptop; shared runners get slack (specs/design.md, LD10).
  MUMBLE_PERF_SLACK: 3

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      - name: Tests (release, includes the L2.5 benchmark)
        run: cargo test --release
      - name: Builds for WebAssembly (L1.3)
        run: cargo build -p mumble-speech --target wasm32-unknown-unknown --release
      - name: Crate packages for crates.io (L9.2)
        if: runner.os == 'Linux'
        run: cargo publish --dry-run -p mumble-speech

  ffi:
    name: ffi (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Header is up to date
        if: runner.os == 'Linux'
        run: |
          cargo install cbindgen --version 0.29.4 --locked
          cbindgen --config crates/mumble-ffi/cbindgen.toml --crate mumble-ffi --output bindings/c/include/mumble.h --verify crates/mumble-ffi
      - name: Build (Linux, Windows)
        if: runner.os != 'macOS'
        run: cargo build -p mumble-ffi --release
      - name: Build universal library (macOS arm64 + x86_64)
        if: runner.os == 'macOS'
        run: |
          cargo build -p mumble-ffi --release --target aarch64-apple-darwin
          cargo build -p mumble-ffi --release --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create -output target/release/libmumble_ffi.dylib \
            target/aarch64-apple-darwin/release/libmumble_ffi.dylib \
            target/x86_64-apple-darwin/release/libmumble_ffi.dylib
          lipo -info target/release/libmumble_ffi.dylib
      - name: Configure
        run: cmake -S bindings/c -B build/c -DCMAKE_BUILD_TYPE=Release ${{ runner.os == 'macOS' && '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"' || '' }}
      - name: Build tests
        run: cmake --build build/c --config Release
      - name: CTest (all conformance vectors through the C ABI)
        run: ctest --test-dir build/c -C Release --output-on-failure
      - name: Conformance vectors as x86_64 under Rosetta (macOS)
        if: runner.os == 'macOS'
        run: arch -x86_64 build/c/test_vectors

  godot:
    name: godot (${{ matrix.godot }})
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported version (L4.6) and the latest tested one.
        godot: [4.3-stable, 4.7.2-stable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the GDExtension into the addon
        run: bindings/godot/build.sh
      - name: Download Godot ${{ matrix.godot }}
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${{ matrix.godot }}/Godot_v${{ matrix.godot }}_linux.x86_64.zip"
          unzip -q godot.zip -d godot
          mv godot/Godot_v*_linux.x86_64 godot/godot
      - name: Import project
        run: godot/godot --headless --path bindings/godot --import || true
      - name: Speakers never read the device rate (static guard, L4.10)
        # Grep guard for the code review rule: no device rate in the speakers' synthesis path.
        run: |
          fail=0
          if grep -rnIE 'AudioSettings\.(outputSampleRate|GetConfiguration)' bindings/unity/Runtime; then fail=1; fi
          if grep -rnIE 'get_mix_rate|(^|[^A-Za-z_])mix_rate\(\)' crates/mumble-godot/src bindings/godot/addons; then fail=1; fi
          if [ "$fail" -ne 0 ]; then echo "::error::a speaker reads the device rate (L4.10)"; exit 1; fi
      - name: Headless tests (vectors, typewriter, speaker) under several output rates
        # The speakers synthesize at a fixed 48 kHz whatever the mix rate (L4.10, LD17). Each run
        # sets the rate with an override.cfg; the test fails if the engine did not apply it.
        run: |
          for rate in 44100 48000 22050 96000; do
            echo "::group::mix rate $rate"
            printf '[audio]\ndriver/mix_rate=%s\n' "$rate" > bindings/godot/override.cfg
            MUMBLE_EXPECT_MIX_RATE=$rate godot/godot --headless --path bindings/godot -s res://tests/run_tests.gd
            echo "::endgroup::"
          done
          rm -f bindings/godot/override.cfg
      - name: Example scene runs without errors
        run: |
          godot/godot --headless --path bindings/godot --quit-after 300 2>&1 | tee example.log
          ! grep -E "SCRIPT ERROR|ERROR:" example.log

  godot-web-build:
    # The web library of the Godot addon (specs/design.md §9.3.1, L4.15, L4.17, LD27-LD29): nightly Rust and
    # Emscripten pinned in scripts/godot-web/versions.env; the library is checked and handed to godot-web.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read the pinned versions
        id: pins
        run: grep -E '^[A-Z_]+=' scripts/godot-web/versions.env >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: godot-web
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ steps.pins.outputs.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Desktop builds are unchanged (stable Rust, API 4.3, no wasm features)
        run: |
          cargo tree -p mumble-godot -e features > features.txt
          cat features.txt
          grep -q 'godot feature "api-4-3"' features.txt
          if grep -q 'experimental-wasm' features.txt; then
            echo "::error::the desktop build enables a wasm feature of gdext"
            exit 1
          fi
      - name: Build mumble_godot.wasm (nightly, build-std, wasm32-unknown-emscripten)
        run: scripts/godot-web/build.sh target/godot-web
      - name: Check the library (side module, no threads, entry symbol, size budget, .gdextension)
        run: |
          {
            echo "### mumble_godot.wasm (web library, pinned ${{ steps.pins.outputs.RUST_NIGHTLY }} and Emscripten ${{ steps.pins.outputs.EMSDK_VERSION }})"
            echo
            echo '```'
            node scripts/godot-web/check-wasm.mjs target/godot-web/mumble_godot.wasm \
              --gdextension bindings/godot/addons/mumble_speech/mumble_speech.gdextension
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # tee hides the exit status of the checks: run them again for it (they are quick).
          node scripts/godot-web/check-wasm.mjs target/godot-web/mumble_godot.wasm \
            --gdextension bindings/godot/addons/mumble_speech/mumble_speech.gdextension > /dev/null
      - name: Negative self-tests of the checks
        run: scripts/godot-web/check-wasm.test.sh
      - uses: actions/upload-artifact@v7
        with:
          name: godot-web-lib
          path: target/godot-web/mumble_godot.wasm
          if-no-files-found: error

  godot-web:
    # The Godot web export runs in a browser, served without COOP/COEP (specs/design.md §9.3.1, L4.15, L4.16,
    # L5.2, LD31): the conformance vectors and the speaker timing, with audio running and suspended.
    needs: godot-web-build
    name: godot-web (${{ matrix.godot }})
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported version (L4.6) and the latest tested one, as in the godot job.
        godot: [4.3-stable, 4.7.2-stable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: godot-web-lib
          path: bindings/godot/addons/mumble_speech/bin
      - name: Download Godot ${{ matrix.godot }}
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${{ matrix.godot }}/Godot_v${{ matrix.godot }}_linux.x86_64.zip"
          unzip -q godot.zip -d godot
          mv godot/Godot_v*_linux.x86_64 godot/godot
      - name: Export templates (the two non-threaded dlink web templates, cached)
        uses: actions/cache@v6
        with:
          path: ~/.cache/mumble-godot-web-templates
          key: godot-web-templates-${{ matrix.godot }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/godot-web/package-lock.json
      - name: Install Playwright and Chromium
        working-directory: scripts/godot-web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Audio device (PulseAudio null sink)
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1 || true
          sleep 2
          pactl load-module module-null-sink sink_name=ci_null
          pactl set-default-sink ci_null
          pactl info | grep -i 'default sink'
      - name: Export the test runner (Web (tests), no threads, extensions on)
        run: scripts/godot-web/export.sh "$PWD/godot/godot" build/godot-web-tests
      - name: Chromium, audio running
        run: node scripts/godot-web/run-tests.mjs build/godot-web-tests --browser chromium --audio running
      - name: Chromium, audio suspended (no user gesture, L4.16)
        run: node scripts/godot-web/run-tests.mjs build/godot-web-tests --browser chromium --audio suspended
      - name: Export the example (Web preset) and run it
        run: |
          scripts/godot-web/export.sh "$PWD/godot/godot" build/godot-web-example Web
          node scripts/godot-web/run-tests.mjs build/godot-web-example --browser chromium --audio running --mode example

  godot-web-browsers:
    # Firefox and WebKit: informative, not a required check yet (specs/design.md LD31, LQ14). Promote each
    # after ten consecutive green runs on main.
    needs: godot-web-build
    name: godot-web-browsers (${{ matrix.browser }})
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { browser: firefox, audios: 'running suspended' }
          # Playwright's WebKit has no flag to allow audio without a gesture: suspended only.
          - { browser: webkit, audios: 'suspended' }
    runs-on: ubuntu-latest
    env:
      GODOT: 4.7.2-stable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: godot-web-lib
          path: bindings/godot/addons/mumble_speech/bin
      - name: Download Godot ${{ env.GODOT }}
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/$GODOT/Godot_v${GODOT}_linux.x86_64.zip"
          unzip -q godot.zip -d godot
          mv godot/Godot_v*_linux.x86_64 godot/godot
      - uses: actions/cache@v6
        with:
          path: ~/.cache/mumble-godot-web-templates
          key: godot-web-templates-${{ env.GODOT }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/godot-web/package-lock.json
      - name: Install Playwright and ${{ matrix.browser }}
        working-directory: scripts/godot-web
        run: |
          npm ci
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Audio device and virtual display
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils xvfb
          pulseaudio --start --exit-idle-time=-1 || true
          sleep 2
          pactl load-module module-null-sink sink_name=ci_null
          pactl set-default-sink ci_null
      - name: Export the test runner
        run: scripts/godot-web/export.sh "$PWD/godot/godot" build/godot-web-tests
      - name: Run in ${{ matrix.browser }} (headed, software WebGL)
        run: |
          for audio in ${{ matrix.audios }}; do
            echo "::group::${{ matrix.browser }}, audio $audio"
            xvfb-run -a node scripts/godot-web/run-tests.mjs build/godot-web-tests --browser ${{ matrix.browser }} --audio "$audio" --headed
            echo "::endgroup::"
          done

  unity-interop:
    # The Unity package's UnityEngine-free code, C# 9, against the real native library (LD13).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the C ABI library
        run: cargo build -p mumble-ffi --release
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Conformance vectors through the C# interop layer
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
        run: dotnet run -c Release --project "bindings/unity/DotnetTests~/MumbleSpeech.Interop.Tests.csproj"
      - name: Missing native library gives an actionable error (L4.11)
        # No LD_LIBRARY_PATH: the library is not found, as in a source checkout.
        run: dotnet run -c Release --no-build --project "bindings/unity/DotnetTests~/MumbleSpeech.Interop.Tests.csproj" -- --expect-load-failure
      - name: build.sh stops on unsupported platforms and runs the Linux and Git Bash branches (L4.12)
        # Stubs uname and cargo; no Rust build happens here (scripts/unity/build-sh.test.sh).
        run: sh scripts/unity/build-sh.test.sh

  android:
    # Unity on Android (specs/design.md §9.4.1, L4.13, L4.14, LD21-LD25): the three libraries are built,
    # checked and their import settings verified; the core vectors run on 32-bit ARM under QEMU.
    runs-on: ubuntu-latest
    env:
      # Pinned: an LTS NDK (LD23). Bump together with the NDK in release.yml.
      NDK_VERSION: r27c
      CARGO_NDK_VERSION: 3.5.4
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,armv7-unknown-linux-gnueabihf
      - uses: Swatinem/rust-cache@v2
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false
      - name: Export the NDK location
        run: echo "ANDROID_NDK_HOME=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
      - name: Build the libraries for arm64-v8a, armeabi-v7a, x86_64
        run: scripts/android/build.sh target/android
      - name: Check the libraries (exports, machine, 16 KB alignment, dependencies)
        run: scripts/android/check.sh target/android bindings/c/include/mumble.h
      - name: Check the Unity import settings
        run: scripts/android/check-metas.sh bindings/unity
      - name: Negative self-tests of the checks
        run: scripts/android/selftest.sh target/android
      - name: Install QEMU and the 32-bit ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
      - name: Core conformance vectors on 32-bit ARM (QEMU user mode, LD25)
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_RUNNER: qemu-arm -L /usr/arm-linux-gnueabihf
        run: cargo test -p mumble-conformance --target armv7-unknown-linux-gnueabihf

  scripts-tests:
    # Tests of the Android checks, the Unity build script and the release scripts with fakes: no NDK,
    # cmake or Godot needed (specs/tasks.md N3, N5).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Android checks, fake llvm-readelf and fixture metas
        run: scripts/android/check.test.sh
      - name: Unity build script, arguments and the desktop path
        run: bindings/unity/build.test.sh
      - name: Release verification, broken archives fail
        run: scripts/release/verify.test.sh
      - name: Release notes, Android in the Unity row only
        run: node --test scripts/release/notes.test.mjs
      - name: Godot web build script, arguments and toolchain errors
        run: scripts/godot-web/build.test.sh
      - name: Godot web library checks, broken modules fail
        run: scripts/godot-web/check-wasm.test.sh
      - name: Godot web browser runner, helpers
        run: node --test scripts/godot-web/run-tests.test.mjs

  site:
    # Docs at /, playground at /playground/ (specs/design.md §12, L7). Deployed from main only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the site (fails on dead links)
        run: npm run build:site
      - name: Deploy to mumble-speech.github.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.SITE_DEPLOY_KEY }}
          external_repository: mumble-speech/mumble-speech.github.io
          publish_branch: main
          publish_dir: docs/.vitepress/dist
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: Deploy basteez/mumble-speech@${{ github.sha }}

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          # Must match the wasm-bindgen crate version in crates/mumble-wasm.
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build (WASM + TypeScript)
        run: npm run build --workspace @mumble-speech/web
      - name: Typecheck
        run: npm run typecheck --workspace @mumble-speech/web
      - name: Tests (vectors in WASM, Speaker equivalence, L2.5, L4.2 size)
        run: npm test --workspace @mumble-speech/web
      - name: External consumption check (L6.2)
        run: npm run consume-check --workspace @mumble-speech/web

  playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The playground consumes @mumble-speech/web, which is built from the Rust core.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build @mumble-speech/web
        run: npm run build --workspace @mumble-speech/web
      - name: Typecheck
        run: npm run typecheck --workspace @mumble-speech/playground
      - name: Tests
        run: npm test --workspace @mumble-speech/playground
      - name: Build
        run: npm run build --workspace @mumble-speech/playground
