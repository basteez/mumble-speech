# Release (specs/design.md §13, L8). A tag vX.Y.Z publishes a GitHub Release with four
# archives. Manual runs and pull requests that change the release pipeline are dry runs:
# same builds and checks, no release.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release/**
      - CHANGELOG.md

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Every package has the same version, equal to the tag (L8.2)
        id: check
        run: |
          cargo_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "mumble-speech") | .version')
          web_version=$(jq -r .version packages/web/package.json)
          unity_version=$(jq -r .version bindings/unity/package.json)
          echo "cargo $cargo_version, web $web_version, unity $unity_version"
          [ "$cargo_version" = "$web_version" ] && [ "$cargo_version" = "$unity_version" ] || { echo "::error::package versions differ"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$cargo_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $cargo_version"; exit 1
          fi
          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"

  native:
    needs: version
    name: native (${{ matrix.platform }})
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-x64 }
          - { os: windows-latest, platform: windows-x64 }
          - { os: macos-latest, platform: macos-universal }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Build C ABI and Godot libraries
        run: |
          mkdir -p out
          if [ "$RUNNER_OS" = "macOS" ]; then
            for target in aarch64-apple-darwin x86_64-apple-darwin; do
              cargo build --release -p mumble-ffi -p mumble-godot --target "$target"
            done
            for lib in libmumble_ffi.dylib libmumble_godot.dylib; do
              lipo -create -output "out/$lib" "target/aarch64-apple-darwin/release/$lib" "target/x86_64-apple-darwin/release/$lib"
            done
            lipo -info out/*.dylib
          else
            cargo build --release -p mumble-ffi -p mumble-godot
            if [ "$RUNNER_OS" = "Windows" ]; then
              cp target/release/mumble_ffi.dll target/release/mumble_ffi.dll.lib target/release/mumble_godot.dll out/
            else
              cp target/release/libmumble_ffi.so target/release/libmumble_godot.so out/
            fi
          fi
          ls -l out
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}
          path: out/
          if-no-files-found: error

  web:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w @mumble-speech/web
      - name: npm pack
        run: |
          mkdir -p out
          npm pack -w @mumble-speech/web --pack-destination out
          ls -l out
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: out/
          if-no-files-found: error

  assemble:
    needs: [version, native, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Build the four archives (L8.1)
        run: scripts/release/assemble.sh "${{ needs.version.outputs.version }}" artifacts release
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release/
          if-no-files-found: error

  verify:
    needs: [version, assemble]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Download Godot 4.3 (minimum supported)
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q godot.zip -d godot && mv godot/Godot_v*_linux.x86_64 godot/godot
      - name: Check the archives before publishing
        run: scripts/release/verify.sh "${{ needs.version.outputs.version }}" release "$PWD/godot/godot"

  notes:
    # Release notes and checksums (L8.3, L8.4); shown in the run summary, so dry runs are a preview.
    needs: [version, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the releases/generate-notes API; it creates nothing
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release
      - name: GitHub's generated notes (merged pull requests, compare link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="v$VERSION" -f target_commitish="$GITHUB_SHA" --jq .body > generated.md \
            || { echo "::warning::could not generate the pull request list"; : > generated.md; }
      - name: Compose the notes
        run: |
          mkdir -p notes
          node scripts/release/notes.mjs "$VERSION" release notes/notes.md \
            ${{ github.ref_type == 'tag' && '--require-changelog' || '' }} \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --generated generated.md
          mv release/SHA256SUMS.txt notes/
          cat notes/notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: notes/
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [version, verify, notes]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: notes
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp notes/SHA256SUMS.txt release/
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" \
            --title "mumble-speech $GITHUB_REF_NAME" --notes-file notes/notes.md --verify-tag

  # Registries (design §13.1, L9). Each job is independent (L9.5) and runs only after the
  # GitHub Release exists.

  npm:
    if: github.ref_type == 'tag'
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: ${{ runner.temp }}/release
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing support (≥ 11.5.1)
        run: npm install -g npm@^11.5.1 && npm --version
      - name: Publish @mumble-speech/web (the release tarball)
        env:
          # Only for the first publish; once trusted publishing is set up the secret is deleted
          # and npm authenticates with OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "${{ runner.temp }}/release/mumble-speech-web-${{ needs.version.outputs.version }}.tgz" --access public --provenance

  crates:
    if: github.ref_type == 'tag'
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing
    env:
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Trusted publishing token
        id: auth
        if: env.HAS_TOKEN != 'true'
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish the mumble-speech crate
        env:
          # The secret only exists for the first publish (crates.io requires the crate to exist).
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        run: cargo publish -p mumble-speech

  upm:
    if: github.ref_type == 'tag'
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the upm branch and tag
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: Commit the package (with native plugins) on branch upm
        run: |
          tar -xzf "$RUNNER_TEMP/release/com.mumble-speech.unity-$VERSION.tgz" -C "$RUNNER_TEMP"
          scripts/release/publish-branch.sh upm "upm/v$VERSION" "$RUNNER_TEMP/package" \
            "com.mumble-speech.unity $VERSION (generated from basteez/mumble-speech@$GITHUB_SHA)"
          {
            echo "## Unity package"
            echo
            echo "- Branch \`upm\`, tag \`upm/v$VERSION\`, commit \`$(git rev-parse "upm/v$VERSION")\`"
            echo "- Install by git URL: \`https://github.com/$GITHUB_REPOSITORY.git#upm/v$VERSION\`"
            echo "- OpenUPM picks up new \`upm/\` tags automatically once the package is submitted."
          } >> "$GITHUB_STEP_SUMMARY"

  godot-addon:
    if: github.ref_type == 'tag'
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the godot-addon branch and tag
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: Commit the addon (with native libraries) on branch godot-addon
        run: |
          content="$RUNNER_TEMP/godot-addon"
          mkdir -p "$content"
          unzip -q "$RUNNER_TEMP/release/mumble-speech-godot-$VERSION.zip" -d "$content"
          # The Asset Library wants a LICENSE file at the root; the project is MIT OR Apache-2.0.
          cp LICENSE-MIT "$content/LICENSE"
          cp LICENSE-APACHE "$content/"
          cat > "$content/README.md" <<EOF
          # mumble-speech $VERSION for Godot

          Generated from [basteez/mumble-speech](https://github.com/$GITHUB_REPOSITORY) — do not edit.
          Copy \`addons/mumble_speech\` into your project (Godot 4.3+, Windows x64, macOS universal, Linux x64).
          Documentation: https://mumble-speech.github.io/bindings/godot
          EOF
          scripts/release/publish-branch.sh godot-addon "godot/v$VERSION" "$content" \
            "mumble-speech Godot addon $VERSION (generated from basteez/mumble-speech@$GITHUB_SHA)"
          commit=$(git rev-parse "godot/v$VERSION^{commit}")
          {
            echo "## Godot Asset Library: values for this release"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Version | \`$VERSION\` |"
            echo "| Godot version | 4.3 |"
            echo "| Repository host | GitHub |"
            echo "| Repository URL | https://github.com/$GITHUB_REPOSITORY |"
            echo "| Issues URL | https://github.com/$GITHUB_REPOSITORY/issues |"
            echo "| Download commit | \`$commit\` |"
            echo "| Icon URL | https://mumble-speech.github.io/icon.png |"
            echo "| License | MIT |"
          } >> "$GITHUB_STEP_SUMMARY"

