<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Turn text into video-game mumble speech in three styles." />
    <title>Mumble Speech</title>
  </head>
  <body>
    <main class="app">
      <h1>Mumble Speech</h1>

      <div class="field">
        <label for="text">Text</label>
        <textarea id="text" rows="3" maxlength="500" spellcheck="false">Hello</textarea>
        <span id="counter" class="counter" aria-live="off">5/500</span>
      </div>

      <fieldset class="styles">
        <legend>Style</legend>
        <div id="style-options" class="style-options"></div>
      </fieldset>

      <fieldset class="voice">
        <legend>Voice</legend>
        <div class="slider">
          <label for="pitch">Pitch</label>
          <input id="pitch" type="range" min="-12" max="12" step="1" value="0" />
          <output id="pitch-out" for="pitch">0 st</output>
        </div>
        <div class="slider">
          <label for="speed">Speed</label>
          <input id="speed" type="range" min="5" max="30" step="1" value="15" />
          <output id="speed-out" for="speed">15 c/s</output>
        </div>
        <div class="slider">
          <label for="variation">Variation</label>
          <input id="variation" type="range" min="0" max="1" step="0.05" value="0" />
          <output id="variation-out" for="variation">0.00</output>
        </div>
      </fieldset>

      <div id="viz" class="viz" aria-hidden="true"></div>

      <p id="message" class="message" aria-live="polite"></p>

      <div class="actions">
        <button id="play" type="button" aria-pressed="false">▶ Play</button>
        <button id="export" type="button">⤓ Export WAV</button>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
