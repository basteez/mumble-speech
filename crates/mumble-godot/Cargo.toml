[package]
name = "mumble-godot"
description = "Godot 4 GDExtension of mumble-speech (addon: bindings/godot/addons/mumble_speech)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
mumble-speech = { path = "../mumble-core" }
unicode-segmentation = "1.13.3"

# The `godot` dependency is split by target (specs/design.md §9.3.1, LD28, LD29): desktop builds
# use the prebuilt Godot 4.3 API, so the addon loads in 4.3 and every later 4.x; the web build
# (wasm32-unknown-emscripten, nightly Rust, no threads) adds the experimental wasm features.
# Keep the two `version` fields equal: Cargo cannot enforce it.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
godot = { version = "0.5.5", features = ["api-4-3"] }

[target.'cfg(target_family = "wasm")'.dependencies]
godot = { version = "0.5.5", features = ["api-4-3", "experimental-wasm", "experimental-wasm-nothreads", "lazy-function-tables"] }
