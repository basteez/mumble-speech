[package]
name = "mumble-godot"
description = "Godot 4 GDExtension of mumble-speech (addon: bindings/godot/addons/mumble_speech)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
mumble-speech = { path = "../mumble-core" }
unicode-segmentation = "1.13.3"

# The `godot` dependency is split by target (specs/design.md §9.3.1, §9.3.2, LD28, LD29, LD37): desktop
# builds use the prebuilt Godot 4.3 API, so the addon loads in 4.3 and every later 4.x; the two web
# builds (wasm32-unknown-emscripten, nightly Rust) add the experimental wasm features. The web entry is
# chosen by the target feature `atomics`: scripts/godot-web/build.sh --threads adds `+atomics` to the
# rustflags and gets the threaded entry, so gdext's `experimental-wasm-nothreads` can never meet
# `-pthread`. `lazy-function-tables` is on both (it is only incompatible with `experimental-threads`,
# which we do not use). Keep the three `version` fields equal: Cargo cannot enforce it.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
godot = { version = "0.5.5", features = ["api-4-3"] }

[target.'cfg(all(target_family = "wasm", not(target_feature = "atomics")))'.dependencies]
godot = { version = "0.5.5", features = ["api-4-3", "experimental-wasm", "experimental-wasm-nothreads", "lazy-function-tables"] }

[target.'cfg(all(target_family = "wasm", target_feature = "atomics"))'.dependencies]
godot = { version = "0.5.5", features = ["api-4-3", "experimental-wasm", "lazy-function-tables"] }
