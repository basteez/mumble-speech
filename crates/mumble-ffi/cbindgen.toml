language = "C"
header = """/* mumble-speech C ABI (specs/design.md §9.2).
 * Generated by cbindgen from crates/mumble-ffi. Do not edit. */"""
include_guard = "MUMBLE_H"
cpp_compat = true
sys_includes = ["stddef.h", "stdint.h"]
no_includes = true
usize_is_size_t = true
documentation_style = "c99"

[export]
prefix = ""
include = ["MumbleVoice", "MumbleEvent", "MumbleUtterance"]

[enum]
rename_variants = "ScreamingSnakeCase"
