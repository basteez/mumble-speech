[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[profile.release]
lto = true
codegen-units = 1

# Size-optimized build for the WebAssembly package (L4.2).
[profile.wasm]
inherits = "release"
opt-level = "z"
panic = "abort"
